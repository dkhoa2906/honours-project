[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bcg"
version = "0.1.0"
description = "BCG: dual-mode (Graz and game) collection of labeled motor imagery EEG epochs"
readme = "README.md"
# developed and tested on Python 3.13.2 only
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["bcg_core", "bcg_collect", "bcg_live", "bcg_server"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
